<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>宜中一日</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
:root{
  --bg:#e9eef1; --surface:#ffffff; --surface2:#f1f5f7; --ink:#14263d; --ink2:#52647a; --line:#d3dce4;
  --accent:#c9432f; --accent-ink:#ffffff; --gold:#f0b429; --green:#2b8a57; --blue:#2f6fa8;
  --hud:rgba(255,255,255,.94); --shadow:0 10px 30px rgba(20,38,61,.2);
  --sky-top:#82bde9; --sky-hor:#dcebf1; --fog:#dcebf1; --scrim:rgba(14,24,36,.55);
  --f-zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-en:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-disp:"LXGW WenKai TC","Noto Sans TC","PingFang TC",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1622; --surface:#15263a; --surface2:#1b3049; --ink:#e8eef5; --ink2:#a6b6c9; --line:#2b415b;
    --accent:#ff7c64; --accent-ink:#1b0d09; --gold:#f5be3c; --green:#58c28a; --blue:#6aaee6;
    --hud:rgba(18,32,50,.94); --shadow:0 10px 30px rgba(0,0,0,.5); --scrim:rgba(4,8,14,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1622; --surface:#15263a; --surface2:#1b3049; --ink:#e8eef5; --ink2:#a6b6c9; --line:#2b415b;
  --accent:#ff7c64; --accent-ink:#1b0d09; --gold:#f5be3c; --green:#58c28a; --blue:#6aaee6;
  --hud:rgba(18,32,50,.94); --shadow:0 10px 30px rgba(0,0,0,.5); --scrim:rgba(4,8,14,.65);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-zh);margin:0;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
#app{position:relative;height:100%;overflow:hidden;background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-hor) 52%,#b9d4a8 52.1%,#9cc588 100%);touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
.en,.en-only{font-family:var(--f-en)}
.zh+.en{display:block;font-size:.84em;color:var(--ink2);line-height:1.4;margin-top:1px}
.on-dark .zh+.en,.sheet-card .zh+.en{color:var(--ink2)}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--hud);color:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow);padding:0}
.ib svg{width:22px;height:22px}
.ib:active{transform:scale(.94)}
.ib[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.ib .lg{font:700 13px/1 var(--f-en)}
.btn{border:0;border-radius:12px;padding:11px 18px;background:var(--accent);color:var(--accent-ink);font-weight:700;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.25}
.btn.alt{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.btn .en{font-size:.82em;font-weight:500;opacity:.9;display:block}
.btn .zh+.en{color:inherit;opacity:.85}
.chip{display:inline-block;font-size:11px;font-family:var(--f-en);font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.chip.her{background:#7a3d6b;color:#fff;border-color:#7a3d6b}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
.topbar{position:absolute;left:16px;right:16px;top:12px;display:flex;gap:8px;align-items:flex-start}
.topbar .col{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0;flex:1}
.topbar .btns{display:flex;gap:8px;flex:none}
.pill{background:var(--hud);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);padding:6px 14px;display:inline-flex;align-items:center;gap:8px;min-height:44px;max-width:100%;font-weight:700;text-align:left}
.pill svg{width:18px;height:18px;flex:none}
.pill .bar{width:64px;height:6px;border-radius:99px;background:var(--line);overflow:hidden;flex:none}
.pill .bar i{display:block;height:100%;background:var(--green);width:0;transition:width .4s}
.task{width:fit-content;background:var(--hud);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:14px;box-shadow:var(--shadow);padding:8px 10px 8px 12px;display:flex;gap:10px;align-items:center;max-width:520px}
.task .txt{min-width:0;flex:1;line-height:1.35}
.task .lab{font:700 11px/1 var(--f-en);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:3px}
.task .nm{font-weight:700}
.task .nm .zh,.task .nm .en{display:inline}
.task .nm .zh+.en{display:block}
.talk{position:absolute;left:50%;transform:translateX(-50%);bottom:22px;max-width:calc(100% - 32px);border:0;border-radius:16px;background:var(--ink);color:var(--surface);padding:10px 18px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;min-height:52px;font-weight:700;animation:pop .25s ease-out}
.talk kbd{font:700 12px var(--f-en);border:1px solid currentColor;border-radius:6px;padding:1px 7px;opacity:.8}
.talk small{display:block;font:500 12px var(--f-en);opacity:.8}
@keyframes pop{from{transform:translateX(-50%) translateY(10px);opacity:0}to{transform:translateX(-50%);opacity:1}}
.mini{position:absolute;left:16px;bottom:16px;width:190px;height:156px;border-radius:14px;border:2px solid var(--hud);box-shadow:var(--shadow);background:#cfe0bf;cursor:pointer}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.lk{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);border-left-width:4px;background:var(--surface2);color:var(--ink);text-decoration:none;font-weight:600;font-size:13px;line-height:1.3;max-width:100%;touch-action:manipulation}
.lk svg{width:16px;height:16px;flex:none;opacity:.8}
.lk.news{border-left-color:var(--gold)}
.lk.site{border-left-color:var(--blue)}
.lk:hover,.lk:focus-visible{background:var(--surface);outline:2px solid var(--blue);outline-offset:1px}
.lk .zh+.en{font-weight:500}
.endbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;width:auto;height:44px;border-radius:999px;font:700 13px/1 var(--f-zh)}
.endbtn svg{width:18px;height:18px}
@media (pointer:coarse){
  .mini{width:116px;height:95px}
}
@media (max-width:560px){ .endbtn .lb{display:none} .endbtn{padding:0;width:44px} }
.pill>span:first-of-type{white-space:nowrap}
@media (max-width:560px){
  /* phone: pill + buttons share row 1, the next-stop card gets the full width of row 2 */
  .topbar{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"pill btns" "task task";gap:8px;align-items:start}
  .topbar .col{display:contents}
  #bProg{grid-area:pill;justify-self:start}
  .topbar .btns{grid-area:btns}
  .task{grid-area:task;width:auto;max-width:none}
  .pill{font-size:14px}
  .pill .lb{display:none}
  .pill .bar{display:none}
}
@media (max-width:380px){.pill .bar{display:none}}
#toasts{position:absolute;left:16px;right:16px;top:124px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:var(--surface);border-radius:14px;padding:8px 14px;box-shadow:var(--shadow);max-width:min(420px,100%);font-weight:600;line-height:1.35;animation:tin .25s ease-out;display:flex;gap:10px;align-items:center}
.toast .en{color:inherit;opacity:.85}
.toast .k{font:700 10px var(--f-en);letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:#3b2a00;border-radius:6px;padding:2px 6px;flex:none}
.toast.out{opacity:0;transform:translateY(-6px);transition:.35s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@media (max-width:560px){#toasts{top:auto;bottom:228px}}

/* ---------- dialogue sheet ---------- */
#sheet{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 12px 12px;pointer-events:none;z-index:20}
.sheet-card{pointer-events:auto;width:min(760px,100%);max-height:62%;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;animation:up .28s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sh-head{display:flex;gap:12px;align-items:center;padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.sh-av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font:700 18px var(--f-disp);border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line)}
.sh-who{flex:1;min-width:0;line-height:1.3}
.sh-who b{font-family:var(--f-disp);font-size:17px}
.sh-who .org{font-size:12px;color:var(--ink2)}
.sh-body{padding:14px 16px;overflow:auto;flex:1;font-size:16px;line-height:1.7;animation:fade .3s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sh-body .zh{display:block}
.sh-body .en{display:block;font-size:14.5px;color:var(--ink2);margin-top:6px}
.sh-body .en-only{display:block;font-size:16.5px}
.sh-note{font-size:12px;color:var(--ink2);border-top:1px dashed var(--line);margin-top:12px;padding-top:8px;line-height:1.45}
.sh-foot{display:flex;gap:10px;align-items:center;padding:10px 14px 12px;border-top:1px solid var(--line);background:var(--surface2)}
.dots{display:flex;gap:5px;flex:1;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.dots i.past{background:var(--ink2)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;line-height:1.45}
.opt:hover{border-color:var(--blue)}
.opt.ok{border-color:var(--green);background:color-mix(in srgb,var(--green) 14%,var(--surface))}
.opt.bad{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{margin-top:10px;border-radius:12px;padding:9px 12px;background:var(--surface2);border-left:4px solid var(--green);font-size:14px}
.fb.bad{border-left-color:var(--accent)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;border-bottom:2px dotted var(--blue);cursor:help;font-weight:600}
.term:hover{background:color-mix(in srgb,var(--blue) 14%,transparent)}
#pop{position:absolute;left:50%;transform:translateX(-50%);bottom:30%;width:min(420px,calc(100% - 32px));background:var(--ink);color:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;z-index:40;animation:fade .2s}
#pop b{font-family:var(--f-disp);font-size:17px}
#pop .en{color:inherit;opacity:.85}
#pop .k{font:700 10px var(--f-en);letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}

/* ---------- modals ---------- */
#modal{position:absolute;inset:0;background:var(--scrim);z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media (min-width:700px){#modal{align-items:center;padding:20px}}
.m-card{background:var(--surface);color:var(--ink);width:min(820px,100%);max-height:94%;border-radius:22px 22px 0 0;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;animation:up .25s ease-out}
@media (min-width:700px){.m-card{border-radius:22px;max-height:88%}}
.m-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.m-head h2{margin:0;flex:1;font:700 20px/1.25 var(--f-disp);min-width:0}
.m-head h2 .en{font-family:var(--f-en);font-size:13px;font-weight:600;margin-top:2px}
.m-body{overflow:auto;padding:4px 16px 18px;flex:1;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 10px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 14px;font-weight:600;line-height:1.2;text-align:center;min-height:44px}
.tab .en{font-size:11px;display:block;color:var(--ink2);font-weight:500}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tab[aria-selected="true"] .en{color:inherit;opacity:.85}
.card{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 13px;margin-top:10px}
.card.lock{background:var(--surface2);color:var(--ink2);border-style:dashed}
.card h3{margin:0 0 4px;font:700 16px/1.35 var(--f-disp)}
.card p{margin:6px 0 0}
.card ul{margin:6px 0 0;padding-left:20px}
.card li{margin:4px 0}
details.card>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;font-weight:700;min-height:32px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg);transition:.2s;flex:none}
details[open].card>summary::after{transform:rotate(-135deg)}
details.card>.in{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.sec{font:700 12px var(--f-en);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:18px 0 0}
.trail{display:flex;gap:8px;margin:10px 0 2px;flex-wrap:wrap}
.trail i{width:30px;height:30px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;color:var(--ink2)}
.trail i.on{border:2px solid #7a3d6b;background:#7a3d6b;color:#fff}
.trail svg{width:16px;height:16px}
table.kv{width:100%;border-collapse:collapse;margin-top:6px}
table.kv th,table.kv td{text-align:left;vertical-align:top;padding:7px 4px;border-bottom:1px solid var(--line)}
table.kv th{width:34%;font-weight:600;color:var(--ink2)}
.tl{margin:8px 0 0;padding:0;list-style:none;border-left:3px solid var(--line)}
.tl li{position:relative;padding:2px 0 12px 16px}
.tl li::before{content:"";position:absolute;left:-8px;top:7px;width:13px;height:13px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.tl b{font-family:var(--f-en);font-size:15px;color:var(--accent)}
.bars{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
.bar2{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center}
.bar2 .tr{height:10px;border-radius:99px;background:var(--line);position:relative;overflow:hidden}
.bar2 .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.hint{font-size:13px;color:var(--ink2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.pp{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.pp .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}
.pp.done .ck{background:var(--green);border-color:var(--green)}
.pp svg{width:16px;height:16px}
.bigmap{display:block;width:100%;border-radius:14px;border:1px solid var(--line);margin-top:8px;cursor:crosshair;touch-action:manipulation;background:#cfe0bf}
.cardimg{display:block;width:min(100%,360px);margin:6px auto 0;border-radius:14px;box-shadow:var(--shadow);aspect-ratio:9/16;background:var(--surface2)}
input.tx{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--ink);padding:11px 12px;font:inherit;min-height:44px;-webkit-user-select:text;user-select:text}
input.tx:focus{outline:2px solid var(--blue);outline-offset:1px}
label.fl{display:block;font-weight:700;margin:14px 0 6px;line-height:1.35}
label.fl .en{font-weight:500}

/* ---------- start screen ---------- */
#start{position:absolute;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;background:linear-gradient(180deg,rgba(14,24,36,.0) 0%,rgba(14,24,36,.55) 100%);overflow:auto;touch-action:pan-y}
@media (min-height:760px) and (min-width:700px){.s-card{margin:auto}}
.s-card{background:var(--surface);color:var(--ink);width:min(860px,100%);margin:auto auto 0;border-radius:24px 24px 0 0;padding:20px 16px 18px;box-shadow:var(--shadow);animation:up .4s ease-out}
@media (min-width:700px){.s-card{border-radius:24px;padding:26px 28px}}
.s-title{font:700 clamp(30px,6vw,46px)/1.1 var(--f-disp);margin:0;letter-spacing:.02em}
.s-sub{margin:6px 0 0;color:var(--ink2)}
.s-hero{width:min(100%,500px);margin:0 auto 10px}
.s-hero .sh-ph{margin:0}
.s-hero .sh-ph img{max-height:none}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:14px}
.role{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px 12px 22px;position:relative;overflow:hidden;line-height:1.4}
.role::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--rc)}
.role b{display:block;margin-bottom:4px}
.role b .zh{font:700 19px/1.3 var(--f-disp)}
.role b .en{font:700 14px/1.3 var(--f-en);color:var(--ink2);margin-top:0}
.role[aria-checked="true"]{border-color:var(--rc);background:color-mix(in srgb,var(--rc) 12%,var(--surface))}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:9px 14px;min-height:44px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.howto{font-size:13px;color:var(--ink2);margin:12px 0 0;line-height:1.5}
.s-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.s-actions .btn{flex:1 1 180px}
.warn{background:color-mix(in srgb,var(--gold) 24%,var(--surface));border:1px solid var(--gold);border-radius:12px;padding:9px 12px;margin-top:12px;font-size:13px}

/* ---------- quest layer ---------- */
.role.route{display:flex;flex-direction:column;gap:3px;min-width:0}
.role .rt{align-self:flex-start;font:700 12px/1.5 var(--f-en);background:var(--rc);color:#fff;border-radius:999px;padding:1px 10px;margin-bottom:4px}
.role .rf{font-weight:600;font-size:14px;line-height:1.35}
.role .rb{font-size:12.5px;color:var(--ink2);line-height:1.35}
.role .rf .zh+.en,.role .rb .zh+.en{font-size:12px;margin-top:0}
.free{display:block;width:100%;margin-top:8px;border:1.5px dashed var(--line);background:transparent;border-radius:12px;padding:8px 12px;color:var(--ink2);min-height:44px;text-align:center}
.free .zh,.free .en{display:inline}
.free .zh+.en{display:inline;margin-left:8px;font-size:.9em}
.free[aria-checked="true"]{border-style:solid;border-color:var(--ink);color:var(--ink);background:var(--surface2)}
.s-xy{margin-top:12px}
.xy{display:flex;gap:10px;align-items:flex-start;margin:6px 0 4px}
.xy .av{flex:none;width:44px;height:44px;border-radius:50%;background:#e8793a;color:#fff;display:grid;place-items:center;font:700 20px var(--f-disp);font-style:normal;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line)}
.xy .bub{background:var(--surface2);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:9px 12px;line-height:1.6;min-width:0;flex:1}
.xy .who{font:700 13px var(--f-zh);margin-bottom:2px}
.xy .who small{font:500 11px var(--f-en);color:var(--ink2);margin-left:4px}
.xy .bub .zh{display:block}
.xy .bub .zh+.en{font-size:13.5px;margin-top:4px}
.chip.par{background:#2b8a57;border-color:#2b8a57;color:#fff}

      T('這四個字是 1946 年李祖壽校長訂的。那時候同學來自四面八方，母語都不一樣，他希望大家像一家人。我們現在說「全校一家，宜中有品」：在彼此關懷的大家庭裡，培養有品格、有品質、有品味的宜中人。', 'These four characters were chosen in 1946 by Principal Li Zushou. His students came from all over and spoke different mother tongues, and he wanted them to feel like one family. Today we say: one school, one family, a school of character. In a caring family we nurture people of character, quality and taste.'),
      T('我每天早上都會在校園裡走一走。走著走著，就會遇到好多讓人感動的小故事：同學互相幫忙，老師陪著學生。我常想，這些故事不該只留在我的腦海裡，所以我們才有了「宜中電子報」。', 'I take a walk around the campus every morning, and I keep running into small stories that move me: students helping each other, teachers walking alongside them. I thought these stories should not stay in my head alone, and that is why we started the YLSH e-newsletter.'),
      T('我一直相信：如果一所學校什麼都好，但同學品行不好，這樣的教育仍是失敗的，對吧?! 信念決定行動，行動決定習慣，習慣決定品德。品德從愛班級、愛學校開始，校長和老師也要先做好榜樣。', 'I firmly believe that if a school is good at everything but its students’ conduct is poor, that education has still failed, right?! Beliefs shape actions, actions shape habits, habits shape character. Character starts with loving your class and your school, and the principal and teachers must set the example first.'),
      T('我希望每個孩子都有三種力量。首先是思考力，能獨立思考，在不同的價值之間做出判斷；其次是生命力，樂觀自信，跌倒了還站得起來；最後是行動力，勇敢去做。總結就是：對自己有期待，對世界有熱情。', 'I hope every student grows three strengths. First, thinking: thinking independently and forming judgments among many values. Second, vitality: staying optimistic and confident, and getting back up after a fall. Third, action: having the courage to act. In short: expect something of yourself, and be passionate about the world.'),
      T('宜中是一所「多元展能的圓夢學園」，數理、科學、英語文、音樂、美術、體育，都有舞台。連續三年，宜蘭唯一的學測滿級分都出自宜中，這要感謝行政和教學團隊用心規劃，才形塑出好的學習風氣。', 'YLSH is a "dream-making school for many talents": math, science, languages, music, art and sport all have a stage. Three years running, the only perfect GSAT score in Yilan came from YLSH, and I thank our administrators and teaching teams, whose careful planning built a good culture of learning.'),
      T('最後送你一句話：我相信「方向對了，目標就不遠」。將重要的事情做好，就是最大特色！高中三年是探索自我、建立自信的重要時期，有家長的支持、老師的陪伴，讓我們一起努力與加油！', 'Finally, one thought for you: I believe that when the direction is right, the goal is not far. Doing the important things well is the greatest distinction of all! The three high-school years are a key time to explore yourself and build confidence, and with your family’s support and your teachers’ company, let us work hard together!')
    ],
    rl: {
      junior: T('歡迎你來看看宜中。走走看看，問問學長姐，看看這裡是不是你的下一站。', 'You are welcome to look around YLSH. Walk about, ask the older students, and see whether this is your next stop.'),
      fresh: T('恭喜你，正式成為宜中人！高中課程在深度與廣度上和國中不同，差異會越來越明顯。方向與努力同等重要：想在三年後有成果，現在就要改變習慣、找到更有效率的學習策略。', 'Congratulations, you are officially a YLSH student! High-school courses differ from junior high in depth and breadth, and the gap keeps growing. Direction matters as much as effort: if you want results in three years, change your habits and find more effective strategies now.'),
      intl: T('國際朋友也是我們的一家人。希望你在這裡交到朋友。', 'Our international friends are family too. I hope you make friends here.')
    }
  },

    hello: T('我是教務主任。教務處的口號是：擁抱學識，奠定真實能力。', 'I am the Dean of Academic Affairs. Our motto: embrace knowledge and build real ability.'),

    own: [
      T('宜中三年學習攻略，先記前三條。一、熟讀《宜中課諮學涯任務手冊》，提早思考生涯規劃。二、專注聽講、準時繳交作業，用評量結果反思並調整學習策略。三、把握時機主動提問。', 'Your three-year study playbook, part 1. (1) Read the school\'s course-and-career guidebook and start thinking about your path early. (2) Listen in class, hand in work on time, and use test results to adjust how you study. (3) Ask questions at the right moment.'),

        { t: T('只在下次考前一天熬夜補', 'Cram the night before the next test'), ok: false, fb: T('熬夜不是辦法。規律作息與主動提問，才是長久之計。', 'All-nighters do not help. A steady routine and asking questions work better over time.') }

  {
    id: 'sci', loc: 'sci', kind: 'teacher', color: '#2b6f77', stand: R2W(-55, 38), face: R2W(-76, 33),
    title: T('科學館導覽員（示意角色）', 'Science Hall guide (illustrative)'), org: T('科學館', 'Science Hall'),
    hello: T('嗨，歡迎來科學館！這棟樓 1988 年 11 月落成，後面的溫室還比它早兩個月完工。來參觀的人最常問我：數資班和科實班，到底差在哪？我來說說看。', 'Hi, welcome to the Science Hall! This building opened in November 1988, and the greenhouse behind it was finished two months earlier. The question visitors ask me most is: what is the difference between the Gifted Class and the Science Class? Let me explain.'),
    mode: 'own',
    own: [
      T('先說數理資優班。1988 年起招生，是宜蘭縣第一個資優班，每年 27 位，要先通過資優鑑定的初試和複試。高一下學期開始分科分組教學，往數理生醫工程的方向走。', 'First, the Math & Science Gifted Class. It has admitted students since 1988, the first gifted class in Yilan County, with 27 places a year; applicants pass a gifted-identification screening and a second round. From the second term of first year, teaching splits by subject and group, heading toward math, science, biomedicine and engineering.'),
      T('他們有個可愛的傳統：高一辦科學營，高二辦成果發表，高三把經驗傳給學弟妹。連續三年，宜蘭唯一的學測滿級分，都出在這個班。', 'They have a lovely tradition: first-years run a science camp, second-years hold a results showcase, and third-years pass their experience on to the younger ones. Three years running, the only perfect GSAT score in Yilan has come from this class.'),
      T('再說科學實驗班，2021 年成立，每年 33 位，看會考的數理成績，或是科學競賽的成果。它和臺大、師大、宜大合作：高一是「孕育期」，做實驗、讀經典、聽科學講座、參訪大學。', 'Now the Science Experimental Class, founded in 2021 with 33 places a year, admitted by exam scores in math and science or by science-competition results. It partners with NTU, NTNU and NIU. First year is the "nurturing" phase: experiments, classics, science lectures and university visits.'),
      T('高二是「成長期」，把高一到高三的數理加深加廣課程提早修完，專題研究還有大學教授一起帶。暑假有一場科學班資格考，是臺大科教中心辦的；高三是「驗收期」，可以去臺大、師大、宜大修課抵學分。', 'Second year is the "growth" phase: the advanced math and science electives of all three years are taken early, and project research is co-guided by university professors. In the summer there is a qualifying exam run by NTU’s science-education center; third year is the "harvest" phase, with credit-bearing courses at NTU, NTNU or NIU.'),
      T('科實班三年都有一門必修叫「獨立研究」，從選題、做實驗到寫成果，自己走完一遍。2023 年旺宏科學獎，全國大約 600 件作品，他們拿下 2 個優選、1 個佳作。', 'All three years include a required course called "Independent Research": choosing a topic, running the experiments and writing it up, all on your own. At the 2023 Macronix Science Awards, among about 600 entries nationwide, the class won two merit awards and one honorable mention.'),
      T('不是這兩個班也有得玩。理工電資班群高一有〈半導體未來力〉，從二極體、電晶體一路看到製程；生醫藥農班群高二在宜科園區做實驗，調過蝶豆花分層飲料，也萃取過水果的 DNA。', 'Other tracks get to play too. The Science-Engineering-IT track has "Semiconductor Future" in first year, from diodes and transistors all the way to fabrication; the Biomedicine-Agriculture track does lab work at the Yilan Science Park in second year, from butterfly-pea layered drinks to extracting DNA from fruit.'),
      T('玩出成果的例子：理工班群的火箭隊，是高二自主學習做出來的，拿過台灣盃火箭競賽全國第三名；2026 年分區科展 11 件作品全數獲獎，4 件特優晉級全國。2025 年 11 月，全國「高中女生科學教育巡訪」的第一站，就辦在這間科學館。', 'Some results of all that playing: the rocket team from the Engineering-IT track grew out of a second-year independent-learning project and took third place nationally at the Taiwan Cup rocket contest; in 2026 all 11 regional science-fair entries won prizes and four top awards advanced to the nationals. And in November 2025 the first stop of the national tour of science events for senior-high girls was held in this very hall.')

    rl: {

/* 電子報:雲端空間(Google Drive)裡的 PDF。open: false 表示檔案目前沒有開放「知道連結的人可檢視」,
   玩家打不開,所以先不顯示;把檔案共用設定改成公開後,把 open 改成 true 即可。 */
const GDRIVE_VIEW = (id) => 'https://drive.google.com/file/d/' + id + '/view';
const NEWS_ISSUES = {
  n1412: { id: '19bH0vgwP377zOcG_pF3mHB-LxTf8lUd1', open: false, zh: '2025 年 12 月號', en: 'Dec 2025 issue' },

/* 學校官網:只放確認打得開、內容也對得上的頁面 */
const SITE = 'https://www.ylsh.ilc.edu.tw/';
const SITE_PAGES = {
  s_home: { u: SITE, zh: '宜中官網', en: 'school website' },
  s_hist: { u: SITE + 'home?cid=1233', zh: '校史', en: 'school history' },
  s_courses: { u: SITE + 'home?cid=2259', zh: '特色課程成果', en: 'featured course results' },

/* id → { u, kind: 'news' | 'site', label: T(...) };打不開的連結回傳 null */
function linkOf(id) {
  const n = NEWS_ISSUES[id];

  SIGNS.forEach((s) => { g.fillStyle = S.signs[s.id] ? 'rgba(61,143,209,.5)' : '#3d8fd1'; g.beginPath(); g.arc(X(s.pos[0]), Z(s.pos[1]), big ? 4 : 2.4, 0, 7); g.fill(); });
  const nid = nextTask(), rt = routeNpcIds();
  NPCS.forEach(function (n) {
    const met = !!S.met[n.id], r = (rt.indexOf(n.id) >= 0 ? 1.25 : 0.85) * (big ? 6 : 3.6);
    g.beginPath(); g.arc(X(n.stand[0]), Z(n.stand[1]), r, 0, 7); g.fillStyle = met ? '#2b8a57' : '#f0b429'; g.fill(); g.lineWidth = big ? 2 : 1.4; g.strokeStyle = '#fff'; g.stroke();
    if (n.id === nid) { const k = (now % 1.4) / 1.4; g.beginPath(); g.arc(X(n.stand[0]), Z(n.stand[1]), r + 3 + k * 14, 0, 7); g.strokeStyle = 'rgba(201,67,47,' + (1 - k) + ')'; g.lineWidth = 2.5; g.stroke(); }
  });
  const px = X(P.x), pz = Z(P.z), col = routeColor();
  g.save(); g.translate(px, pz); g.rotate(-P.h + Math.PI); g.beginPath(); const s = big ? 11 : 7; g.moveTo(0, -s); g.lineTo(s * 0.7, s * 0.8); g.lineTo(0, s * 0.35); g.lineTo(-s * 0.7, s * 0.8); g.closePath(); g.fillStyle = col; g.fill(); g.lineWidth = 2; g.strokeStyle = '#fff'; g.stroke(); g.restore();
}
function drawMini() {
  const cv = $('mini'); if (!cv || $('hud').hidden) return; const g = cv.getContext('2d');
  if (!mapBase) mapBase = drawMapBase(MAPW, MAPH, false);
  if (cv.height !== MAPH) cv.height = MAPH;
  g.drawImage(mapBase, 0, 0); drawMapOverlay(g, MAPW, MAPH, false);
}
let bigMapBase = null, bigMapKey = '';
function showMap() {
  openModal('map', function () {
    setModalHtml('<div class="m-card">' + mHead(T('校園地圖', 'Campus map')) + '<div class="m-body"><p class="hint">' + tx(T('點地圖上的任何位置，我就帶你走過去；點人物圓點會直接去找他。', 'Tap anywhere on the map and I will walk you there; tap a person to go and meet them.')) + '</p><canvas class="bigmap" id="bigmap"></canvas>'
      + '<p class="hint"><b style="color:#d9a21b">●</b> ' + esc(short(T('還沒認識', 'Not met'))) + ' &nbsp; <b style="color:#2b8a57">●</b> ' + esc(short(T('已認識', 'Met'))) + ' &nbsp; <b style="color:#3d8fd1">●</b> ' + esc(short(T('告示牌', 'Info board'))) + '</p></div></div>');
    const cv = $('bigmap'), w = Math.min(1000, Math.round(cv.getBoundingClientRect().width * (window.devicePixelRatio || 1))) || 760, h = Math.round(w * MAPH_M / MAPW_M);
    cv.width = w; cv.height = h; const key = w + S.lang; if (key !== bigMapKey) { bigMapBase = drawMapBase(w, h, true); bigMapKey = key; }
    const g = cv.getContext('2d'); g.drawImage(bigMapBase, 0, 0); drawMapOverlay(g, w, h, true);
    cv.onclick = function (e) {
      const r = cv.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width, fz = (e.clientY - r.top) / r.height, x = BOUNDS.x0 + fx * MAPW_M, z = BOUNDS.z0 + fz * MAPH_M;
      let best = null, bd = 1e9; NPCS.forEach(function (n) { const d = Math.hypot(n.stand[0] - x, n.stand[1] - z); if (d < bd) { bd = d; best = n; } });
      const tol = 14 * (MAPW_M / r.width);
      closeModal(); if (best && bd < tol) goToNpc(best.id, true); else walkTo(x, z, {});
    };

}

/* ---------- summary card ---------- */
function wrapText(g, text, maxW, maxLines) {
  const lines = []; let cur = '';
  for (const ch of Array.from(text)) {
    const t = cur + ch;
    if (g.measureText(t).width > maxW && cur) { lines.push(cur); cur = ch; if (lines.length >= maxLines) return lines; } else cur = t;
  }
  if (cur && lines.length < maxLines) lines.push(cur); return lines;
}
let cardTimer = null;
function showEnd() {
  openModal('end', function () {
    const r = route();
    setModalHtml('<div class="m-card">' + mHead(UI.endTitle) + '<div class="m-body"><p class="hint">' + tx(UI.endSave) + '</p><img id="cardImg" class="cardimg" alt="Summary card">'
      + (r ? '<div class="row" style="justify-content:center;margin-top:8px"><span class="chip">' + esc(short(UQ.time)) + ' ' + fmtTime(S.q.sec) + '</span><span class="chip">' + esc(short(UQ.solved(firstTry(), r.beats.length))) + '</span><span class="chip">' + esc(short(UQ.quiz)) + ' ' + count(S.rq) + '/' + ROAMERS.length + '</span></div>' : '')
      + '<label class="fl" for="wishIn">' + tx(UI.wishLabel) + '</label><input id="wishIn" class="tx" maxlength="40" autocomplete="off" placeholder="' + esc(short(UI.wishPh)) + '" value="' + esc(S.wish || '') + '">'
      + endExtra()

      + '<div class="s-actions"><button class="btn" type="button" data-act="copy">' + tx(UI.copy) + '</button><button class="btn alt" type="button" data-act="close">' + tx(UI.again) + '</button></div><p class="hint" id="copyMsg"></p></div></div>');
    const upd = function () { $('cardImg').src = drawCard(); $('sumTx').value = summaryText(); };
    upd();
    $('wishIn').addEventListener('input', function () { S.wish = this.value.slice(0, 40); save(); clearTimeout(cardTimer); cardTimer = setTimeout(upd, 200); });
  }, { keepScroll: true });
}

/* ---------- ui actions ---------- */
function uiAction(a, t) {
  const id = t.dataset.id;
  switch (a) {
    case 'route': startRoute = id; renderStart(); break;
    case 'slang': startLang = id; langTouched = true; S.lang = id; renderStart(); if (!noGL) World.setLang(id); break;
    case 'begin': beginGame(); break;
    case 'continue': continueGame(); break;
    case 'startplay': startPlay(); break;
    case 'passport': modal && modal.name === 'passport' ? closeModal() : (!dlg && showPassport()); break;
    case 'codex': modal && modal.name === 'codex' ? closeModal() : (!dlg && showCodex()); break;
    case 'about': modal && modal.name === 'about' ? closeModal() : (!dlg && showAbout()); break;
    case 'aerial': setAerial(!aerial); break;
    case 'exit': showExit(); break;
    case 'exitgo': leaveGame(); break;
    case 'lang': S.lang = ({ both: 'zh', zh: 'en', en: 'both' })[S.lang]; langTouched = true; startLang = S.lang; applyLang(); break;
    case 'cxtab': cxTab = id; if (modal) { modal.keepScroll = false; renderCodex(); modal.keepScroll = true; } break;
    case 'copy': {
      const msg = $('copyMsg'), txt = summaryText();
      const fallback = function () { const ta = $('sumTx'); ta.focus(); ta.select(); msg.textContent = short(T('已選取文字，請手動複製。', 'Text selected; copy it manually.')); };
      try { navigator.clipboard.writeText(txt).then(function () { msg.textContent = short(UI.copied); }, fallback); } catch (e) { fallback(); }
      break;
    }
    case 'reset': {
      if (t.dataset.sure) { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } startRoute = null; showStart(); }
      else { t.dataset.sure = '1'; t.innerHTML = tx(T('再按一次確認清除進度', 'Tap again to erase your progress')); }
      break;
    }
    default: questAction(a, t);
  }
}
function applyLang() {
  if (!noGL) World.setLang(S.lang);
  refreshHud(); if (dlg) renderSheet(); if (modal && modal.render) modal.render(); hidePop(); save();
}

/* ---------- boot ---------- */
function loadFonts() {
  if (!document.fonts || !document.fonts.load) return Promise.resolve();
  let sample = 'ABCabc國立宜蘭高級中學校長主任教務處學務總務輔導圖書館人文謙學樓懷山臨風行政大樓音樂科學活動中心育德堂生科美術紅樓新生國際全校一家宿舍體育行健校史校門告示';
  NPCS.forEach((n) => { sample += n.title.zh; }); Object.keys(PLACES).forEach((k) => { sample += PLACES[k].name.zh; });
  const jobs = [document.fonts.load('700 40px "Noto Sans TC"', sample), document.fonts.load('600 26px "Source Sans 3"', 'ABC'), document.fonts.load('700 40px "LXGW WenKai TC"', sample)];
  return Promise.race([Promise.all(jobs.map((p) => p.catch(() => 0))), new Promise((r) => setTimeout(r, 3000))]);
}
function boot() {
  initInput(); try { nameCal(); } catch (e) { /* preload the name calligraphy */ }
  $('modal').addEventListener('click', function (e) { if (e.target === $('modal') && modal && modal.closable) closeModal(); });
  let ok = false, err = '';
  try { ok = World.init($('cv')); } catch (e) { err = String(e); }
  if (ok) {
    try { Nav.build(); World.build(); World.addNpcs(NPCS); World.addSigns(SIGNS); World.addRoamers(ROAMERS); World.setLang('both'); }
    catch (e) { console.error('world build error', e); err = String(e && e.message || e); }
  } else noGL = true;
  $('mini').height = MAPH;
  resetView(); showStart();
  if (err) { const w = document.createElement('div'); w.className = 'warn'; w.textContent = '3D: ' + err; $('startCard').appendChild(w); }
  loadFonts().then(function () { mapBase = null; bigMapBase = null; if (!noGL) World.setLang(S.lang); });
  requestAnimationFrame(loop);
}
window.YLSH = { get S() { return S; }, get dlg() { return dlg; }, P: P, cam: cam, Nav: Nav, World: World, walkTo: walkTo, goToNpc: goToNpc, openNpc: openNpc, openRoamer: openRoamer, goToRoamer: goToRoamer, nextPage: nextPage, showCodex: showCodex, showMap: showMap, showEnd: showEnd, step: step, frame: frame, drawCard: drawCard, setAerial: setAerial };
